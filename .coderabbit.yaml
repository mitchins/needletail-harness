# CodeRabbit configuration — prepared at M0-D, ACTIVATED on PR #1 (13 Oct 2026).
#
# REVIEW.md §5: the supplied configuration opts into epic-labelled,
# non-draft review, keeps actual review status visible, disables decorative
# poetry and automatic code-generation/finishing touches, and supplies
# boundary-focused path instructions. Validated 13 Oct 2026 against the
# installed service schema (docs.coderabbit.ai/reference/configuration,
# schema dated 7 Oct 2026): the former top-level `finish_review` /
# `generate_code_suggestions` keys are not in the schema and were replaced
# with the supported `reviews.finishing_touches.*.enabled` and
# `knowledge_base.*` settings below (CodeRabbit PR #1 finding, fixed).

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
  path_filters:
    # Boundary-focused instructions: the portable core must not gain
    # platform, terminal, HTTP or SQLite implementation imports.
    - "!**/COMPLETE-SPEC.md"
    - "!**/DEPENDENCIES.md"
  path_instructions:
    - path: "Sources/NeedletailCore/**"
      instructions: |
        Portable domain contracts only. No terminal, HTTP, SQLite, process
        or platform-specific imports. Apple-only or Linux-specific code
        belongs behind a qualified shim (PORT-02).
    - path: "Sources/NeedletailTestSupport/**"
      instructions: |
        Development support only. The behaviour-case ledger and results
        reconciliation must never convert a missing, skipped or unexecuted
        case into a pass (BDD-01..04).
    - path: "Tests/**"
      instructions: |
        Behaviour-labelled Swift Testing. Display names begin with the
        stable catalogue case ID (TESTING section 2). No sleeps in place of
        readiness; no oracle regenerated from the code under test.
    - path: "Sources/CReplxx/**"
      instructions: |
        Vendored third-party sources: files under `replxx/` are upstream
        and must remain byte-identical to the pinned commit
        (`./dev vendor-check`). The only permitted Needletail-owned files
        here are the bridge (`include/shim.h`, `include/module.modulemap`)
        and the vendoring records (`README.provenance`,
        `SHA256SUMS-vendored`); `replxx/LICENSE.md` is upstream, unmodified.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
knowledge_base:
  web_search:
    enabled: false
  mcp:
    usage: disabled
  automatic_linking_mode: disabled

# REVIEW §5 ("Disable automatic cross-repository knowledge/MCP/web
# expansion for this project") is implemented by the knowledge_base block
# above; field names verified against the installed service reference
# (docs.coderabbit.ai/reference/configuration, schema 7 Oct 2026).
