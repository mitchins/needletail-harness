# PTY-08 fresh tmux-server bootstrap diagnostic — bounded, isolated, one-shot.
# Runs ONLY on manual dispatch (never on push). Private per-run socket,
# isolated TMUX_TMPDIR, timeout(1) as the sole bounding mechanism, and
# live ps/wchan sampling — read-only inspection, no pattern kills, no
# broad cleanup. Purpose: explain why `tmux new-session -d` never
# returns when spawned by Foundation Process on CI while the identical
# command works from a shell (the ChatPTYTests PTY-08 finding).
name: pty08-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tmux-bootstrap-probe:
    name: fresh tmux server bootstrap probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install tmux + baseline environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          tmux -V
          echo "TERM=${TERM:-<unset>}"
          env | grep -i '^TMUX' || echo "no TMUX environment"

      - name: Probe A — shell-invoked fresh server (baseline)
        run: |
          set -u
          D="$RUNNER_TEMP/probeA"; mkdir -p "$D"
          SOCKET="probeA-$$"
          export TMUX_TMPDIR="$D/tmp"
          mkdir -p "$TMUX_TMPDIR"
          unset TMUX || true
          # Live read-only state sampling while the probe runs.
          ( for i in $(seq 1 22); do
              sleep 1
              ps -o pid,ppid,stat,wchan=30,cmd -C tmux 2>/dev/null | tail -n +2
              echo "-- sample $i done"
            done ) > "$D/ps-sample.txt" &
          SAMPLER=$!
          timeout 20 env TERM=xterm tmux -L "$SOCKET" -vv -f /dev/null \
            new-session -d -s probe -x 80 -y 24 > "$D/client.out" 2> "$D/client.err"
          echo "probeA exit=$?"
          kill "$SAMPLER" 2>/dev/null || true
          wait "$SAMPLER" 2>/dev/null || true
          sleep 1
          { echo "== server -vv log =="; cat "$TMUX_TMPDIR"/tmux-server-*.log 2>/dev/null || ls -la "$TMUX_TMPDIR"
            echo "== client stdout =="; cat "$D/client.out"
            echo "== client stderr =="; cat "$D/client.err"
            echo "== ps samples =="; cat "$D/ps-sample.txt"; } > "$D/summary.txt" 2>&1
          cat "$D/summary.txt"
          # List sessions only if the client returned promptly (never on
          # a hung probe: `tmux ls` would hang on a wedged server).
          if grep -q "exit=0" "$D/summary.txt" 2>/dev/null; then :; fi

      - name: Install pinned Swift toolchain (swiftc for Probe B)
        run: |
          arch="$(uname -m)"
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
          echo "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3  /tmp/swiftly.tar.gz" | sha256sum -c -
          tar -xzf /tmp/swiftly.tar.gz -C /tmp && rm -f /tmp/swiftly.tar.gz
          /tmp/swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" 2>/dev/null || true
          swiftly install 6.4 --assume-yes
          swiftly use 6.4 --global-default
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"

      - name: Probe B — Foundation-Process spawn, EXACT helper arguments (+ TERM differential)
        run: |
          set -u
          D="$RUNNER_TEMP/probeB"; mkdir -p "$D"
          cat > "$D/probe.swift" <<'SWIFT'
          import Foundation
          // Mirrors Tests/NeedletailTerminalTests/ChatPTYTests tmux():
          // /usr/bin/env resolution, stdout captured to a FILE (never a pipe),
          // caller-side bounded poll, TERM/SIGKILL escalation on a verified-own
          // child, FileHandle cleanup. Environment is INHERITED (the helper sets
          // no TERM) — the runner's real TERM reaches the tmux client.
          let socket = CommandLine.arguments[1]
          let tmpDir = CommandLine.arguments[2]
          let proc = Process()
          proc.executableURL = URL(fileURLWithPath: "/usr/bin/env")
          proc.arguments = ["tmux", "-L", socket, "-f", "/dev/null",
                            "new-session", "-d", "-s", "probeB", "-x", "80", "-y", "24"]
          let outURL = URL(fileURLWithPath: tmpDir + "/client-stdout.log")
          FileManager.default.createFile(atPath: outURL.path, contents: nil)
          guard let outHandle = FileHandle(forWritingAtPath: outURL.path) else {
              print("PROBE-B: cannot open capture file"); exit(2)
          }
          defer { try? outHandle.close() }
          proc.standardOutput = outHandle
          print("PROBE-B: spawning \(proc.arguments!.joined(separator: " "))")
          print("PROBE-B: child sees TERM=\(ProcessInfo.processInfo.environment["TERM"] ?? "<unset>")")
          try proc.run()
          let deadline = Date().addingTimeInterval(30)
          while proc.isRunning, Date() < deadline {
              Thread.sleep(forTimeInterval: 0.1)
          }
          if proc.isRunning {
              print("PROBE-B: HUNG past 30s (matches the PTY-08 CI signature)")
              print("PROBE-B: child pid \(proc.processIdentifier) — TERM then SIGKILL (own child)")
              proc.interrupt(); proc.terminate()
              Thread.sleep(forTimeInterval: 1)
              if proc.isRunning { kill(proc.processIdentifier, SIGKILL) }
              exit(1)
          }
          proc.waitUntilExit()
          print("PROBE-B: returned status \(proc.terminationStatus)")
SWIFT
          swiftc -o "$D/probe" "$D/probe.swift" 2>&1 | head -5
          export TMUX_TMPDIR="$D/tmp"
          mkdir -p "$TMUX_TMPDIR"
          unset TMUX || true
          echo "== inherited environment: TERM=${TERM:-<unset>}"
          timeout 90 "$D/probe" "probeB-$$" "$TMUX_TMPDIR" > "$D/probeB1.log" 2>&1
          echo "probeB1 (exact helper mirror) exit=$?"
          cat "$D/probeB1.log"
          echo "== server -vv log from B1 (if any):"
          cat "$TMUX_TMPDIR"/tmux-server-*.log 2>/dev/null || ls -la "$TMUX_TMPDIR"
          # TERM differential: same spawn, explicit TERM=xterm.
          rm -f "$TMUX_TMPDIR"/tmux-server-*.log 2>/dev/null || true
          echo "== now with explicit TERM=xtest-differential =="
          timeout 90 env TERM=xterm "$D/probe" "probeB3-$$" "$TMUX_TMPDIR" > "$D/probeB3.log" 2>&1
          echo "probeB3 (explicit TERM=xterm) exit=$?"
          cat "$D/probeB3.log"
          { echo "== B1 (helper mirror) =="; cat "$D/probeB1.log"
            echo "== B1 server log =="; cat "$D"/server-b1.log 2>/dev/null || true
            echo "== B3 (TERM=xterm differential) =="; cat "$D/probeB3.log"; } > "$D/summary.txt" 2>&1
          cat "$D/summary.txt"

      - name: Probe B2 — Foundation-Process spawn with -vv (differential)
        if: always()
        run: |
          set -u
          D="$RUNNER_TEMP/probeB2"; mkdir -p "$D"
          SOCKET="probeB2-$$"
          export TMUX_TMPDIR="$D/tmp"
          mkdir -p "$TMUX_TMPDIR"
          unset TMUX || true
          timeout 90 "$RUNNER_TEMP/probeB/probe" "$SOCKET" "$TMUX_TMPDIR" verbose > "$D/probeB2-run.log" 2>&1
          echo "probeB2 exit=$?"
          { echo "== probe output =="; cat "$D/probeB2-run.log"
            echo "== server -vv log =="; cat "$TMUX_TMPDIR"/tmux-server-*.log 2>/dev/null || ls -la "$TMUX_TMPDIR"; } > "$D/summary.txt" 2>&1
          cat "$D/summary.txt"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: pty08-tmux-bootstrap-evidence
          path: |
            ${{ runner.temp }}/probeA/
            ${{ runner.temp }}/probeB/
            ${{ runner.temp }}/probeB2/
          if-no-files-found: error
          retention-days: 14
