# Needletail Linux CI (M0-D; activated on PR #1, 13 Oct 2026).
#
# Guardrails per DEVELOPMENT §8 / REVIEW §5:
#   - actions pinned to verified immutable revisions (no tags in `uses:`);
#   - token permissions default to read-only (contents: read);
#   - no pull_request_target; fork PRs receive no credentials;
#   - offline application tests only: no provider or reviewer secrets.
#
# Toolchain: swiftly-installed Swift 6.4 (the same route as the local
# builder). If the pinned Swift download moves, update both places; CI
# never resolves packages implicitly because ./dev passes
# --disable-automatic-resolution after a resolve step.

name: linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline build and tests (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Validate all workflow actions use verified Node 24 SHA pins
        run: python3 .github/scripts/check-action-pins.py

      - name: Install the pinned Swift toolchain (swiftly)
        run: |
          # Record any image-provided Swift first: later steps must use the
          # pinned toolchain below, never an unpinned image Swift.
          command -v swift >/dev/null 2>&1 && swift --version || echo "no image-provided swift"
          # Verified 13 Oct 2026 (HTTP 200; tarball holds `swiftly` +
          # LICENSE.txt). If upstream re-rolls the archive, the checksum
          # fails loudly: update the pin, do not delete it.
          arch="$(uname -m)"
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
          echo "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3  /tmp/swiftly.tar.gz" | sha256sum -c -
          tar -xzf /tmp/swiftly.tar.gz -C /tmp && rm -f /tmp/swiftly.tar.gz
          /tmp/swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" 2>/dev/null || true
          swiftly install 6.4 --assume-yes
          swiftly use 6.4 --global-default
          # Each `run` step is a fresh shell: persist the shim directory so
          # every later step resolves `swift` to the pinned toolchain.
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"
          export PATH="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin:$PATH"
          swiftly list
          swift --version
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin satisfied" ;;
            *) echo "FAIL: expected Swift 6.4"; exit 1 ;;
          esac

      - name: Confirm pinned toolchain in a fresh step
        run: |
          command -v swift
          swift --version
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin holds across steps" ;;
            *) echo "FAIL: later step does not resolve pinned Swift 6.4"; exit 1 ;;
          esac

      - name: Provision SQLite headers (GRDB system-library requirement)
        run: |
          # GRDB's GRDBSQLite system-library target requires sqlite3.h. This
          # installs the distro dev package on the ephemeral runner only; the
          # harness itself never installs anything (I02).
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          test -f /usr/include/sqlite3.h || { echo "FAIL: sqlite3.h missing after install"; exit 1; }

      - name: Resolve the locked graph (pinned)
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || {
            echo "FAIL: Package.resolved changed during resolve; the lock is authoritative."
            exit 1
          }

      - name: Build
        run: ./dev build

      - name: Pure and primitive suites (quick)
        run: ./dev test quick

      - name: Native primitives (native)
        run: ./dev test native

      - name: Vendor integrity
        run: ./dev vendor-check

      - name: Catalogue reconciliation (coverage)
        run: ./dev coverage

      - name: False-pass guards
        run: |
          # A bogus case ID or a zero-match filter must be red.
          if ./dev test case BOGUS-99; then
            echo "FAIL: a bogus case ID passed."
            exit 1
          fi
          if ./dev test case REV-0; then
            echo "FAIL: a prefix case ID passed."
            exit 1
          fi

      - name: Entry point works via a relative path from another directory
        run: |
          # Regression test for the relative-root_dir defect: invoked as
          # `sh <relpath>/dev` from outside the repo, every log/bundle path
          # must still resolve (a valid case must pass, not fail with a
          # doubled path).
          cd "$(dirname "$GITHUB_WORKSPACE")"
          sh "$(basename "$GITHUB_WORKSPACE")/dev" test case BDD-01

      - name: Runner qualification (expected failure)
        run: ./dev test qualification

  packaging:
    name: release bundle smoke (clean host)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # The release build needs the same pinned toolchain, SQLite headers
      # and resolved graph as the offline job. (The first CI run passed
      # here on the image's unpinned Swift; that accident is not a pin, so
      # the setup is duplicated explicitly rather than assumed.)
      - name: Install the pinned Swift toolchain (swiftly)
        run: |
          command -v swift >/dev/null 2>&1 && swift --version || echo "no image-provided swift"
          arch="$(uname -m)"
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
          echo "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3  /tmp/swiftly.tar.gz" | sha256sum -c -
          tar -xzf /tmp/swiftly.tar.gz -C /tmp && rm -f /tmp/swiftly.tar.gz
          /tmp/swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" 2>/dev/null || true
          swiftly install 6.4 --assume-yes
          swiftly use 6.4 --global-default
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"
          export PATH="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin:$PATH"
          swiftly list
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin satisfied" ;;
            *) echo "FAIL: expected Swift 6.4"; exit 1 ;;
          esac

      - name: Confirm pinned toolchain in a fresh step
        run: |
          command -v swift
          swift --version
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin holds across steps" ;;
            *) echo "FAIL: later step does not resolve pinned Swift 6.4"; exit 1 ;;
          esac

      - name: Provision SQLite headers (GRDB system-library requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          test -f /usr/include/sqlite3.h || { echo "FAIL: sqlite3.h missing after install"; exit 1; }

      - name: Resolve the locked graph (pinned)
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || {
            echo "FAIL: Package.resolved changed during resolve; the lock is authoritative."
            exit 1
          }

      - name: Release bundle
        run: ./dev release-bundle

      - name: Clean-host smoke (digest-pinned image, no network)
        run: ./dev test packaging
