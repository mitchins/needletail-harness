# CI-driven SonarQube Cloud analysis; automatic analysis is disabled in SonarQube Cloud.
# No pull_request_target: fork PRs never receive SONAR_TOKEN.
name: sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: SonarQube Cloud quality gate
    # GitHub does not provide secrets on fork-origin pull_request events.
    # Trusted human-authored branch PRs and main receive analysis; forks and
    # Dependabot PRs (which cannot access ordinary Actions secrets) are skipped.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout full history for new-code and blame analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Sonar token is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_TOKEN missing from repository or organization secrets'
            exit 1
          fi

      # FINAL-03: the quality gate measures real Swift coverage. The
      # scanner imports coverage-generic.xml (see
      # sonar.coverageReportPaths); this job produces it first from a
      # full instrumented run in the same filesystem. Toolchain setup
      # mirrors linux-ci.yml (pinned swiftly Swift 6.4) so the scan
      # never resolves an unpinned toolchain.
      - name: Provision SQLite headers (coverage build requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ripgrep
          test -f /usr/include/sqlite3.h || { echo "FAIL: sqlite3.h missing after install"; exit 1; }

      - name: Install the pinned Swift toolchain (swiftly)
        run: |
          command -v swift >/dev/null 2>&1 && swift --version || echo "no image-provided swift"
          arch="$(uname -m)"
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz"
          echo "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3  /tmp/swiftly.tar.gz" | sha256sum -c -
          tar -xzf /tmp/swiftly.tar.gz -C /tmp && rm -f /tmp/swiftly.tar.gz
          /tmp/swiftly init --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" 2>/dev/null || true
          swiftly install 6.4 --assume-yes
          swiftly use 6.4 --global-default
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"
          export PATH="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin:$PATH"
          swiftly list
          swift --version
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin satisfied" ;;
            *) echo "FAIL: expected Swift 6.4"; exit 1 ;;
          esac

      - name: Confirm pinned toolchain in a fresh step
        run: |
          command -v swift
          swift --version
          case "$(swift --version 2>&1)" in
            *"Swift version 6.4"*) echo "toolchain pin holds across steps" ;;
            *) echo "FAIL: later step does not resolve pinned Swift 6.4"; exit 1 ;;
          esac

      - name: Resolve the locked graph (pinned)
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || {
            echo "FAIL: Package.resolved changed during resolve; the lock is authoritative."
            exit 1
          }

      - name: Genuine instrumented coverage (Sonar generic XML)
        run: ./dev coverage-sonar

      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0, node24
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
