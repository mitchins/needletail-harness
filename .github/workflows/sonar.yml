# CI-driven SonarQube Cloud analysis; automatic analysis is disabled in SonarQube Cloud.
# No pull_request_target: fork PRs never receive SONAR_TOKEN.
name: sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: SonarQube Cloud quality gate
    # GitHub does not provide secrets on fork-origin pull_request events.
    # Trusted branch PRs and main receive analysis; forks keep secret-free Linux CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history for new-code and blame analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Sonar token is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_TOKEN missing from repository or organization secrets'
            exit 1
          fi

      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0, node24
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
