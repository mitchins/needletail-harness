# SonarQube Cloud key observed in Needletail's previous PR decoration.
# Confirm organization and scanner analysis scope on first CI run.
sonar.organization=mitchins
sonar.projectKey=mitchins_needletail-harness
sonar.sourceEncoding=UTF-8

# First-party Swift plus CI/config source. No copied CReplxx sources: they are
# third-party upstream code, not Needletail's production implementation.
sonar.sources=Sources/NeedletailCLI,Sources/NeedletailCore,Sources/NeedletailProviders,Sources/NeedletailRuntime,Sources/NeedletailPresentation,Sources/NeedletailLineEditor,.github/workflows,schemas,examples,Package.swift,dev

# Test-only Swift, integration suites, synthetic Python loopback fixtures, and
# the GitHub Actions pin validator (CI testing infrastructure, not application logic).
sonar.tests=Tests,Sources/NeedletailTestSupport,Sources/NeedletailTypingProbe,demo,.github/scripts

# Do not manufacture coverage on Linux. Add only a Sonar-compatible report
# generated by actual tests and independently qualified in a later milestone.
